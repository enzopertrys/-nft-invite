<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite NFT</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 88%;
      max-width: 420px;
      background: #111722;
      padding: 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 0 35px rgba(90, 80, 255, 0.25);
    }
p
    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #b9c0ce;
      line-height: 1.5;
    }

    .nft {
      font-size: 70px;
      margin: 25px 0;
    }

    .button {
      display: block;
      margin-top: 25px;
      padding: 16px;
      background: #655cff;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: bold;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      color: #737b8c;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="nft">💎</div>

    <h1>Você recebeu um convite NFT</h1>

    <p>
      Use o convite abaixo para acessar a plataforma e conferir o NFT.
    </p>

    <a
      class="button"
      href="COLOQUE-SEU-LINK-AQUI"
      target="_blank"
    >
      Abrir convite
    </a>

    <p class="small">
      Verifique sempre o endereço e as condições da plataforma antes de conectar uma carteira ou realizar qualquer transação.
    </p>

  </div>

</body>
